AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Parameters:
  GitHubPATSecretName:
    Type: String
    Description: Name of the Secrets Manager secret containing the GitHub PAT
  ExtraRunnerLabels:
    Type: String
    Default: ""
    Description: Additional comma separated labels for the runner
  RunnerConfiguration:
    Type: String
    Description: JSON string defining per-region runner settings (AMI, subnets array, security groups, SSH key).
  ReconcileRepositories:
    Type: String
    Default: ""
    Description: >-
      Comma separated owner/repo list whose queued ephemeral jobs are rechecked
      every two minutes and given a runner if theirs never started. Empty
      disables the reconciler.

Conditions:
  ReconcilerEnabled: !Not [!Equals [!Ref ReconcileRepositories, ""]]

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    # Capped at 29s to match the API Gateway REST integration timeout.
    Timeout: 29
    MemorySize: 128
    Environment:
      Variables:
        GITHUB_PAT_SECRET_NAME: !Ref GitHubPATSecretName
        EXTRA_RUNNER_LABELS: !Ref ExtraRunnerLabels
        RUNNER_CONFIGURATION: !Ref RunnerConfiguration
        INSTANCE_PROFILE_ARN: !GetAtt RunnerInstanceProfile.Arn

Resources:
  # IAM Role for EC2 instances
  RunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: CloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/ec2/github-runner:*'

  RunnerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref RunnerInstanceRole
  GitHubActionHookFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      Architectures:
        - arm64
      Handler: bootstrap
      Runtime: provided.al2023
      Events:
        CatchAll:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /
            Method: POST
            RequestParameters:
              - method.request.header.X-GitHub-Event:
                  Required: true
                  Caching: false
      Policies:
        - Statement:
            - Sid: RunInstances
              Effect: Allow
              Action:
                - ssm:GetParameters
                - iam:PassRole
                - ec2:CreateTags
                - ec2:RunInstances
              Resource: "*"
            - Sid: GetGitHubPAT
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:${GitHubPATSecretName}*
    Metadata:
      BuildMethod: makefile
  RunnerReconcilerFunction:
    Type: AWS::Serverless::Function
    Condition: ReconcilerEnabled
    Properties:
      Architectures:
        - arm64
      Handler: bootstrap
      Runtime: provided.al2023
      # Shorter than the schedule period, and no retries, so two ticks never
      # run at once; overlapping ticks can both launch a runner for one job.
      Timeout: 90
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Events:
        Reconcile:
          Type: Schedule
          Properties:
            Schedule: rate(2 minutes)
      Environment:
        Variables:
          AUTOSCALER_MODE: reconcile
          RECONCILE_REPOSITORIES: !Ref ReconcileRepositories
      Policies:
        - Statement:
            - Sid: RunInstances
              Effect: Allow
              Action:
                - ssm:GetParameters
                - iam:PassRole
                - ec2:CreateTags
                - ec2:RunInstances
                - ec2:DescribeInstances
              Resource: "*"
            - Sid: GetGitHubPAT
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:${GitHubPATSecretName}*
    Metadata:
      BuildMethod: makefile

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  GitHubActionHookFunctionAPI:
    Description: "API Gateway endpoint URL for Prod environment for GitHubActionHook function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  GitHubActionHookFunction:
    Description: "GitHub Action Hook Lambda Function ARN."
    Value: !GetAtt GitHubActionHookFunction.Arn
  GitHubActionHookFunctionIamRole:
    Description: "Implicit IAM Role created for GitHubActionHook function"
    Value: !GetAtt GitHubActionHookFunctionRole.Arn
  RunnerReconcilerFunction:
    Condition: ReconcilerEnabled
    Description: "Queued job reconciler Lambda Function ARN; invoke it to reconcile now."
    Value: !GetAtt RunnerReconcilerFunction.Arn
