version: "2"
linters:
  default: all
  enable:
    - gomodguard_v2
    - wsl_v5
  disable:
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - gochecknoglobals
    - gocognit
    - gomodguard
    - wrapcheck
    - varnamelen
    - err113
    - lll
    - cyclop
    - funlen
    - maintidx
    - wsl
  exclusions:
    rules:
      # Table tests spell out label lists literally so each case reads as a
      # workflow's runs-on.
      - path: _test\.go
        linters:
          - goconst
formatters:
  # Enable specific formatter.
  # Default: [] (uses standard Go formatting)
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
